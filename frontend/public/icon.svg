<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Pumpwise logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pumpwise</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#C9961A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12804F"/>
      <stop offset="1" stop-color="#07442B"/>
    </linearGradient>
  </defs>

  <!-- Icon: green badge, gold fuel drop, rising bars -->
  <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#green)"/>
  <path d="M100 38 C100 38 58 88 58 118 a42 42 0 0 0 84 0 C142 88 100 38 100 38 Z" fill="url(#gold)"/>
  <rect x="80" y="128" width="12" height="20" rx="3" fill="#07442B"/>
  <rect x="95" y="116" width="12" height="32" rx="3" fill="#07442B"/>
  <rect x="110" y="104" width="12" height="44" rx="3" fill="#07442B"/>

  <!-- Wordmark -->
  <text x="205" y="125" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-1">
    <tspan fill="#0B5D3B">Pump</tspan><tspan fill="#D4A017">wise</tspan>
  </text>

  <!-- Tagline -->
  <text x="209" y="162" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#5E6F66">KNOW EVERY LITRE</text>
</svg>
