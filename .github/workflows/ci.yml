name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_ADMIN_PASSWORD: postgres
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Fails if a model change is missing its migration
      - run: DJANGO_SECRET_KEY=ci DB_APP_PASSWORD=x DB_OWNER_PASSWORD=x python manage.py makemigrations --check --dry-run
      # Includes the tenant isolation suite. Must always pass.
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: deploy}}
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.sh db/*.sh; do bash -n "$f"; done
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config -q
      - run: |
          for f in Caddyfile Caddyfile.demo; do
            docker run --rm -e DOMAIN=example.com -v "$PWD:/cfg:ro" caddy:2 caddy validate --config /cfg/$f --adapter caddyfile
          done
  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false
      - run: terraform validate
