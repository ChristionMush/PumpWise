services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres}"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: >
      sh -c "python manage.py bootstrap_db &&
             python manage.py migrate --database=owner &&
             python manage.py runserver 0.0.0.0:8000"
  worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    depends_on: [backend, redis]
    volumes: ["./backend:/app"]
  beat:
    build: ./backend
    env_file: .env
    command: celery -A config beat -l info
    depends_on: [backend, redis]
    volumes: ["./backend:/app"]
  frontend:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    environment:
      VITE_API_URL: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
  frontend_node_modules:
