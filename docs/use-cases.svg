<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 890" role="img" aria-label="Use case diagram. Platform admin: create businesses, grant features, trials, suspend or purge. Owner only: stations, people, approving write-offs, settings. Owner and manager (own station): setup, calibration charts, pumps, dips, reports, resolving alerts. Attendant: start and end their shift or part, own cash, join a shared shift. Scheduler: alerts, reminders, daily message, demos." font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" style="max-width:100%;height:auto"><rect x="150" y="8" width="730" height="878" rx="14" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="515" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="currentColor">PumpWise</text><line x1="88" y1="101.0" x2="172" y2="111.0" stroke="currentColor" stroke-width="1.3"/><line x1="88" y1="287.0" x2="172" y2="269.0" stroke="currentColor" stroke-width="1.3"/><line x1="88" y1="287.0" x2="172" y2="396" stroke="currentColor" stroke-width="1.3"/><line x1="88" y1="510" x2="172" y2="510" stroke="currentColor" stroke-width="1.3"/><line x1="88" y1="627.0" x2="172" y2="637.0" stroke="currentColor" stroke-width="1.3"/><line x1="922" y1="785.0" x2="858" y2="795.0" stroke="currentColor" stroke-width="1.3"/><rect x="172" y="40" width="686" height="142" rx="10" fill="#166534" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25"/><text x="184" y="60" font-size="12" font-weight="700" fill="currentColor" opacity="0.75">Platform admin only</text><ellipse cx="346" cy="92" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="96" text-anchor="middle" font-size="12.5" fill="currentColor">Create a business: shared or assigned pumps</text><ellipse cx="684" cy="92" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="96" text-anchor="middle" font-size="12.5" fill="currentColor">Grant features, set station policy</text><ellipse cx="346" cy="144" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="148" text-anchor="middle" font-size="12.5" fill="currentColor">Create, convert or remove a trial</text><ellipse cx="684" cy="144" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="148" text-anchor="middle" font-size="12.5" fill="currentColor">Suspend, reactivate, purge a test business</text><rect x="172" y="198" width="686" height="142" rx="10" fill="#166534" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25"/><text x="184" y="218" font-size="12" font-weight="700" fill="currentColor" opacity="0.75">Owner only</text><ellipse cx="346" cy="250" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="254" text-anchor="middle" font-size="12.5" fill="currentColor">Add stations</text><ellipse cx="684" cy="250" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="254" text-anchor="middle" font-size="12.5" fill="currentColor">Add people, set station (one manager each)</text><ellipse cx="346" cy="302" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="306" text-anchor="middle" font-size="12.5" fill="currentColor">Approve write-offs, accept or send back</text><ellipse cx="684" cy="302" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="306" text-anchor="middle" font-size="12.5" fill="currentColor">Settings, daily message, export data</text><rect x="172" y="356" width="686" height="194" rx="10" fill="#166534" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25"/><text x="184" y="376" font-size="12" font-weight="700" fill="currentColor" opacity="0.75">Owner, and manager for their own station</text><ellipse cx="346" cy="408" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="412" text-anchor="middle" font-size="12.5" fill="currentColor">Tanks, pumps (2+ nozzles, 2+ tanks), prices</text><ellipse cx="684" cy="408" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="412" text-anchor="middle" font-size="12.5" fill="currentColor">Upload tank calibration charts</text><ellipse cx="346" cy="460" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="464" text-anchor="middle" font-size="12.5" fill="currentColor">Assign pumps, plan handover, swap now</text><ellipse cx="684" cy="460" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="464" text-anchor="middle" font-size="12.5" fill="currentColor">Dips, deliveries, dip history</text><ellipse cx="346" cy="512" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="516" text-anchor="middle" font-size="12.5" fill="currentColor">Today, reports, fuel and cash checks</text><ellipse cx="684" cy="512" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="516" text-anchor="middle" font-size="12.5" fill="currentColor">Resolve alerts with a reason and note</text><rect x="172" y="566" width="686" height="142" rx="10" fill="#166534" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25"/><text x="184" y="586" font-size="12" font-weight="700" fill="currentColor" opacity="0.75">Attendant</text><ellipse cx="346" cy="618" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="622" text-anchor="middle" font-size="12.5" fill="currentColor">Start shift on own pumps</text><ellipse cx="684" cy="618" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="622" text-anchor="middle" font-size="12.5" fill="currentColor">End shift or own part, own cash</text><ellipse cx="346" cy="670" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="674" text-anchor="middle" font-size="12.5" fill="currentColor">Join a shared-pump shift</text><rect x="172" y="724" width="686" height="142" rx="10" fill="#166534" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25"/><text x="184" y="744" font-size="12" font-weight="700" fill="currentColor" opacity="0.75">Automatic: every hour and every day</text><ellipse cx="346" cy="776" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="780" text-anchor="middle" font-size="12.5" fill="currentColor">Check alerts, reopen, spot repeats</text><ellipse cx="684" cy="776" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="780" text-anchor="middle" font-size="12.5" fill="currentColor">Remind manager 12 h, tell owner 24 h</text><ellipse cx="346" cy="828" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="346" y="832" text-anchor="middle" font-size="12.5" fill="currentColor">Owner&#x27;s daily message</text><ellipse cx="684" cy="828" rx="160" ry="21" fill="#166534" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/><text x="684" y="832" text-anchor="middle" font-size="12.5" fill="currentColor">Reload demos, run trial lifecycle</text><g stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="70" cy="81.0" r="10"/><line x1="70" y1="91.0" x2="70" y2="117.0"/><line x1="55" y1="101.0" x2="85" y2="101.0"/><line x1="70" y1="117.0" x2="58" y2="139.0"/><line x1="70" y1="117.0" x2="82" y2="139.0"/></g><text x="70" y="159.0" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Platform admin</text><g stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="70" cy="267.0" r="10"/><line x1="70" y1="277.0" x2="70" y2="303.0"/><line x1="55" y1="287.0" x2="85" y2="287.0"/><line x1="70" y1="303.0" x2="58" y2="325.0"/><line x1="70" y1="303.0" x2="82" y2="325.0"/></g><text x="70" y="345.0" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Owner</text><g stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="70" cy="490" r="10"/><line x1="70" y1="500" x2="70" y2="526"/><line x1="55" y1="510" x2="85" y2="510"/><line x1="70" y1="526" x2="58" y2="548"/><line x1="70" y1="526" x2="82" y2="548"/></g><text x="70" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Manager</text><g stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="70" cy="607.0" r="10"/><line x1="70" y1="617.0" x2="70" y2="643.0"/><line x1="55" y1="627.0" x2="85" y2="627.0"/><line x1="70" y1="643.0" x2="58" y2="665.0"/><line x1="70" y1="643.0" x2="82" y2="665.0"/></g><text x="70" y="685.0" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Attendant</text><g stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="940" cy="765.0" r="10"/><line x1="940" y1="775.0" x2="940" y2="801.0"/><line x1="925" y1="785.0" x2="955" y2="785.0"/><line x1="940" y1="801.0" x2="928" y2="823.0"/><line x1="940" y1="801.0" x2="952" y2="823.0"/></g><text x="940" y="843.0" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Scheduler</text></svg>